[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybernotes"
version = "2.1.0"
description = "Modern, ultra-smooth neon desktop sticky notes application built with PyQt6."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kandula Paul Saketh Maurya", email = "mauryakpsofficial@gmail.com"}
]
keywords = ["sticky-notes", "notes", "desktop", "pyqt6", "cyberpunk", "productivity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.5.0",
]

[project.urls]
Homepage = "https://github.com/MauryaKandula/cyber-notes"
Repository = "https://github.com/MauryaKandula/cyber-notes.git"
Author = "https://github.com/MauryaKandula"

[project.gui-scripts]
cybernotes = "cyber_notes:main_entry"
